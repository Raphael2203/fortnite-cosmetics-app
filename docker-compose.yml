services:
  db:
      image: postgres:15
      container_name: fortnite_db_local
      restart: always
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: password
        POSTGRES_DB: fortnite_db
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
    build: ./backend
    command: celery -A app.celery.config:celery_app worker --loglevel=info
    env_file:
      - ./backend/.env.local
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./backend:/app

  celery-beat:
    build: ./backend
    command: celery -A app.celery.config:celery_app beat --loglevel=info
    env_file:
      - ./backend/.env.local
    depends_on:
      - celery
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - ./frontend/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4173:4173"
    depends_on:
      - backend

volumes:
  postgres_data: