services:
  db:
    image: mysql:8.0
    env_file:
      - ./backend/.env
    ports:
      - "3308:3306"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
    build: ./backend
    command: celery -A celery_app.config.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - db
    volumes:
      - ./backend:/app

  celery-beat:
    build: ./backend
    command: celery -A celery_app.scheduler beat --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - celery
      - redis
    volumes:
      - ./backend:/app