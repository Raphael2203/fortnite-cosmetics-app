services:
  backend:
    build: ./backend
    ports:
      - "${APP_PORT}:8000"
    env_file:
      - .env
    depends_on:
      - db
    

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
  db:
    image: mysql:8.0
    env_file:
      - .env
    ports:
      - "3308:3306"

  redis:
    image: redis:7

  celery:
    build: ./backend
    command: celery -A celery_app.config.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - backend
      - redis

  celery-beat:
    build: ./backend
    command: celery -A celery_app.scheduler beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - celery
      - redis