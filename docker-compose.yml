services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_URL=mysql+pymysql://user:password@db:3306/fortnite
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fortnite
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3308:3306"